name: Sync Play Store Metrics

on:
  schedule:
    # Runs daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync Google Play Store Metrics
        run: npm run sync:playstore

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status --porcelain src/data/apps.ts) ]]; then
            git add src/data/apps.ts
            git commit -m "chore(data): auto-sync ratings and downloads from Google Play Store"
            git push
          else
            echo "No metrics changes detected."
          fi
