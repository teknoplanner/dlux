name: Auto-Crawl and Sync Play Store Apps

on:
  schedule:
    # Runs twice a day (at 00:00 and 12:00 UTC) to catch new apps and metrics updates
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

concurrency:
  group: playstore-crawl
  cancel-in-progress: false

jobs:
  auto-crawl-apps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Auto-crawl new apps and sync Play Store data
        run: npm run crawl:playstore

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status --porcelain) ]]; then
            git add src/data/apps.ts scripts/playstore-full.json public/sitemap.xml public/feed.xml
            if [[ -d "public/images/apps" ]]; then
              git add public/images/apps/
            fi
            git commit -m "chore(playstore): auto-crawl and sync apps from Google Play Store"
            git pull --rebase origin main
            git push origin main
          else
            echo "No Play Store changes or new apps detected."
          fi
