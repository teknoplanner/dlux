name: Sync YouTube Shorts

on:
  schedule:
    # Runs daily at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

concurrency:
  group: youtube-shorts-sync
  cancel-in-progress: false

jobs:
  sync-shorts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch and sync YouTube Shorts
        run: npm run sync:shorts

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status --porcelain src/data/shorts.ts) ]]; then
            git add src/data/shorts.ts
            git commit -m "chore(shorts): auto-sync latest YouTube shorts from @dlux-tech"
            git pull --rebase origin main
            git push origin main
          else
            echo "No new YouTube shorts detected."
          fi
